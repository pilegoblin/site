{{define "base"}}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="description" content="Personal web site for Drew Boram, a software developer" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/htmx.org@2.0.4"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"></script>
  <link rel="icon" href="/public/favicon.svg" type="image/svg" />
  <link href="/static/output.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap"
    rel="stylesheet" />
  <title>{{template "title" .}}</title>
</head>

<body class="bg-bg text-text font-sans antialiased selection:bg-accent-dim selection:text-[#0a0a0a]">
  <div class="mx-auto flex min-h-screen max-w-[720px] flex-col px-5 sm:px-8">
    <!-- header -->
    <nav class="flex items-center justify-between border-b border-border py-7" hx-boost="true">
      <a href="/" class="font-mono text-sm text-text-dim">drewboram<span class="text-accent">.</span>com</a>
      <div class="flex gap-7 font-mono text-[13px]">
        <a href="/" class="text-text-dim transition-colors hover:text-accent">home</a>
        <a href="/projects" class="text-text-dim transition-colors hover:text-accent">projects</a>
        <a hx-boost="false" href="mailto:andrew.boram@hotmail.com"
          class="text-text-dim transition-colors hover:text-accent">email</a>
      </div>
    </nav>

    <!-- content -->
    <main class="flex-1">
      {{template "content" .}}
    </main>

    <!-- footer -->
    <footer
      class="mt-auto flex items-center justify-between gap-2 pt-10 pb-14 font-mono text-xs text-text-faint max-sm:flex-col max-sm:items-start">
      <span>&copy; {{year}} Drew Boram</span>
      <div class="flex gap-6">
        <a href="https://github.com/pilegoblin" target="_blank" rel="noopener"
          class="transition-colors hover:text-accent">github</a>
        <a href="https://www.linkedin.com/in/drew-boram-a942ba180/" target="_blank" rel="noopener"
          class="transition-colors hover:text-accent">linkedin</a>
      </div>
    </footer>
  </div>
</body>

</html>
{{end}}
